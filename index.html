<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hesap Makinesi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Hesap makinesi">
    <header><span>GÜNLÜK ARAÇLAR</span><h1>Hesap makinesi</h1></header>
    <section class="screen" aria-label="Sonuç ekranı"><div id="expression">İşlem yapmaya başlayın</div><output id="display" aria-live="polite">0</output></section>
    <div class="keys">
      <button data-action="clear" class="utility">AC</button><button data-action="sign" class="utility" aria-label="İşaret değiştir">±</button><button data-action="percent" class="utility" aria-label="Yüzde">%</button><button data-operator="/" class="operator" aria-label="Böl">÷</button>
      <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button data-operator="*" class="operator" aria-label="Çarp">×</button>
      <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button data-operator="-" class="operator" aria-label="Çıkar">−</button>
      <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button data-operator="+" class="operator" aria-label="Topla">+</button>
      <button data-action="backspace" aria-label="Son basamağı sil">⌫</button><button data-digit="0">0</button><button data-digit="." aria-label="Ondalık virgül">,</button><button data-action="equals" class="equals" aria-label="Eşittir">=</button>
    </div>
    <footer>Klavyenizle de kullanabilirsiniz · Enter = sonuç</footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
